<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理健康助手 · 架构拓扑 v3（对齐 architecture-spec-v3）</title>
<style>
:root{
  --bg:#0f1417; --surface:#171e22; --surface2:#1d262b;
  --line:rgba(140,160,155,.1); --line2:rgba(140,160,155,.24);
  --ink:#e0e8e3; --dim:rgba(200,216,209,.58); --faint:rgba(200,216,209,.3);
  --amber:#e8b45a; --teal:#7fb8a8; --rose:#e08477; --blue:#8fb3d9; --mauve:#b79ac9;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:"Source Code Pro",ui-monospace,Consolas,monospace;
  --serif:"Noto Serif SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);
  background-image:
    linear-gradient(rgba(140,160,155,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(140,160,155,.04) 1px,transparent 1px);
  background-size:28px 28px;
}
::selection{background:rgba(232,180,90,.3);}
nav{
  position:fixed;top:0;left:0;right:0;z-index:50;height:44px;
  display:flex;align-items:center;gap:6px;padding:8px 14px;
  backdrop-filter:blur(14px);background:rgba(15,20,23,.92);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px;overflow-x:auto;white-space:nowrap;
}
nav .logo{font-family:var(--serif);font-size:15px;font-weight:900;margin-right:6px;}
nav .logo span{color:var(--amber);}
nav .tag{color:var(--amber);border:1px solid rgba(232,180,90,.3);padding:3px 9px;border-radius:999px;font-size:10px;}
nav .sp{flex:1;min-width:8px;}
nav .sep{width:1px;height:20px;background:var(--line2);margin:0 6px;}
nav .btn{
  border:1px solid var(--line2);background:var(--surface);color:var(--dim);font-family:var(--mono);
  font-size:11px;padding:5px 11px;border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap;
}
nav .btn:hover{color:var(--amber);border-color:rgba(232,180,90,.4);}
nav .btn.on{color:var(--amber);border-color:rgba(232,180,90,.4);background:rgba(232,180,90,.08);}
nav .btn:disabled{opacity:.35;cursor:default;pointer-events:none;}
nav .btn.warn:hover{color:var(--rose);border-color:rgba(224,132,119,.4);}
nav .hint{color:var(--faint);font-size:10px;}
nav .modtag{font-size:10px;padding:3px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);}
nav .modtag.edit{color:var(--amber);border-color:rgba(232,180,90,.35);}

main{position:fixed;top:44px;left:0;right:0;bottom:0;overflow:auto;padding:14px 16px 40px;}
.wrap{max-width:1460px;margin:0 auto;}
svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;}

/* ── edges ── */
.edge{fill:none;stroke-linecap:round;transition:opacity .25s,stroke .25s;pointer-events:stroke;}
.edge.rose {stroke:var(--rose);opacity:.55;}
.edge.teal {stroke:var(--teal);opacity:.55;}
.edge.blue {stroke:var(--blue);opacity:.5;}
.edge.dim  {stroke:rgba(140,160,155,.45);opacity:.65;}
.edge.dashed{stroke-dasharray:6 6;}
.edge.dashed2{stroke-dasharray:2 5;}
.edge .lab{font-family:var(--mono);font-size:9.5px;fill:var(--dim);}
.edge.lit{opacity:1;stroke-width:2.1;}
.edge.rose.lit{filter:drop-shadow(0 0 5px rgba(224,132,119,.5));}
.edge.teal.lit{filter:drop-shadow(0 0 5px rgba(127,184,168,.5));}
.edge.blue.lit{filter:drop-shadow(0 0 5px rgba(143,179,217,.5));}
.edge.dim.lit{filter:drop-shadow(0 0 5px rgba(200,216,209,.4));}
.edge.sel{stroke-width:2.6;opacity:1;}
.edge.sel.rose{filter:drop-shadow(0 0 7px rgba(224,132,119,.65));}
.edge.sel.teal{filter:drop-shadow(0 0 7px rgba(127,184,168,.65));}
.edge.sel.blue{filter:drop-shadow(0 0 7px rgba(143,179,217,.65));}
.edge.sel.dim{filter:drop-shadow(0 0 7px rgba(200,216,209,.5));}
.edge:hover{stroke-width:2;opacity:.95;}
text.edge.lab{pointer-events:none;}

/* flow animation */
svg.play .edge.flow{stroke-dasharray:7 9;animation:dashflow 1.1s linear infinite;opacity:.95;}
svg.play .edge.flow.dashed{stroke-dasharray:7 9;}
@keyframes dashflow{to{stroke-dashoffset:-16}}

/* ── nodes ── */
svg:not(.editing) .node{cursor:pointer;}
.node{cursor:grab;transition:opacity .25s;}
.node:active{cursor:grabbing;}
.node .nbox{
  stroke-width:1.2;transition:stroke .2s,fill .2s,filter .2s;
  filter:drop-shadow(0 8px 22px -12px rgba(0,0,0,.7));
}
.node .nbadge{font-family:var(--mono);font-size:9px;letter-spacing:.08em;}
.node .ntitle{font-size:15px;font-weight:700;}
.node .nsub{font-size:10.5px;letter-spacing:.02em;}
.node .nrole{font-family:var(--mono);font-size:9px;opacity:.75;letter-spacing:.06em;}
.node:hover .nbox{stroke-width:1.8;filter:drop-shadow(0 0 10px rgba(232,180,90,.28));}
.node.dim{opacity:.32;}

.node.l1 .nbox,.node.simple .nbox{fill:rgba(127,184,168,.10);stroke:rgba(127,184,168,.55);}
.node.l1 .nbadge{fill:var(--teal);}
.node.l2 .nbox,.node.l6 .nbox{fill:rgba(183,154,201,.10);stroke:rgba(183,154,201,.55);}
.node.l2 .nbadge,.node.l6 .nbadge{fill:var(--mauve);}
.node.l3 .nbox,.node.l7 .nbox{fill:rgba(232,180,90,.10);stroke:rgba(232,180,90,.55);}
.node.l3 .nbadge,.node.l7 .nbadge{fill:var(--amber);}
.node.crisis .nbox,.node.hotline .nbox{fill:rgba(224,132,119,.10);stroke:rgba(224,132,119,.6);}
.node.crisis .nbadge,.node.hotline .nbadge{fill:var(--rose);}
.node.complex .nbox,.node.l4 .nbox,.node.l5 .nbox{fill:rgba(143,179,217,.10);stroke:rgba(143,179,217,.55);}
.node.complex .nbadge,.node.l4 .nbadge,.node.l5 .nbadge{fill:var(--blue);}
.node.user .nbox,.node.hotline .nbox{fill:rgba(23,30,34,.4);stroke-dasharray:5 5;stroke-width:1.2;}
.node.l4 .nbox{stroke-dasharray:5 5;}
.node .ntitle,.node .nrole{fill:var(--ink);}
.node .nsub{fill:var(--dim);}

/* ── detail card（预览态点节点查看） ── */
.card{
  position:fixed;right:16px;top:56px;z-index:60;width:318px;max-height:calc(100vh - 76px);overflow:auto;
  background:rgba(23,30,34,.97);border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 22px 60px -20px rgba(0,0,0,.85);padding:14px 16px;
  animation:cardIn .18s ease;
}
.card .ch{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.card .ch .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.card .cx{margin-left:auto;cursor:pointer;color:var(--faint);font-size:15px;line-height:1;padding:2px 5px;border-radius:5px;}
.card .cx:hover{color:var(--ink);background:rgba(255,255,255,.07);}
.card .row{margin:7px 0;}
.card .k{font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:.1em;display:block;margin-bottom:2px;}
.card .v{font-size:11.5px;line-height:1.6;color:var(--dim);}

/* free-line control handle */
.cp{cursor:grab;fill:var(--amber);stroke:#0f1417;stroke-width:2;pointer-events:all;}
.cp:active{cursor:grabbing;}
.cp:hover{fill:#f0c77e;}

/* annot (情绪JSON 一源三用) */
.annot{font-family:var(--mono);font-size:9.5px;fill:var(--amber);opacity:.85;pointer-events:none;}

/* legend */
.legend{font-family:var(--mono);font-size:10px;fill:var(--dim);pointer-events:none;}
.legend .sw{stroke-width:2.4;}
.legend b{font-weight:700;fill:var(--ink);}

/* ── snapshots panel ── */
.panel{
  position:fixed;right:14px;top:54px;z-index:60;width:300px;max-height:calc(100vh - 80px);overflow:auto;
  background:rgba(23,30,34,.98);border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 22px 60px -20px rgba(0,0,0,.85);padding:14px 16px;display:none;animation:cardIn .18s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.panel .ph{font-size:13px;font-weight:700;display:flex;align-items:center;margin-bottom:12px;}
.panel .ph .cx{margin-left:auto;cursor:pointer;color:var(--faint);font-size:15px;padding:2px 5px;border-radius:5px;}
.panel .ph .cx:hover{color:var(--ink);background:rgba(255,255,255,.07);}
.snap{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--surface);}
.snap .nm{font-size:12px;color:var(--ink);flex:1;}
.snap .tm{font-size:9px;color:var(--faint);display:block;margin-top:2px;}
.snap .ops{display:flex;gap:4px;}
.snap .op{border:1px solid var(--line2);background:transparent;color:var(--dim);font-family:var(--mono);font-size:9.5px;padding:3px 7px;border-radius:5px;cursor:pointer;}
.snap .op:hover{color:var(--amber);border-color:rgba(232,180,90,.4);}
.snap .op.del:hover{color:var(--rose);border-color:rgba(224,132,119,.4);}
.empty{font-size:11px;color:var(--faint);text-align:center;padding:14px 0;}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;
  background:rgba(23,30,34,.97);border:1px solid rgba(232,180,90,.4);color:var(--ink);
  font-family:var(--mono);font-size:11px;padding:8px 16px;border-radius:999px;
  opacity:0;transition:opacity .25s;pointer-events:none;
}
.toast.show{opacity:1;}
</style>
</head>

svg.addEventListener('mousemove',e=>{

});

  card=document.createElement('div'); card.className='card';
  card.innerHTML='<div class="ch"><span class="dot" style="background:'+d.dot+'"></span><span>'+esc(d.h)+'</span><span class="cx">✕</span></div>'
