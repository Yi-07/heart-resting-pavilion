<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理健康助手 · C4 架构图</title>
<style>
:root{
  --bg:#0f1417; --surface:#171e22; --surface2:#1d262b;
  --line:rgba(140,160,155,.1); --line2:rgba(140,160,155,.22);
  --ink:#e0e8e3; --dim:rgba(200,216,209,.5); --faint:rgba(200,216,209,.25);
  --amber:#e8b45a; --teal:#7fb8a8; --rose:#e08477; --blue:#8fb3d9; --mauve:#b79ac9;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:"Source Code Pro",ui-monospace,Consolas,monospace;
  --serif:"Noto Serif SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);
  background-image:
    linear-gradient(rgba(140,160,155,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(140,160,155,.04) 1px,transparent 1px);
  background-size:28px 28px;
}
::selection{background:rgba(232,180,90,.3);}

nav{
  position:fixed;top:0;left:0;right:0;z-index:50;height:44px;
  display:flex;align-items:center;gap:8px;padding:8px 16px;
  backdrop-filter:blur(14px);background:rgba(15,20,23,.9);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px;
}
nav .logo{font-family:var(--serif);font-size:15px;font-weight:900;margin-right:8px;white-space:nowrap;}
nav .logo span{color:var(--amber);}
.breadcrumb{
  border:0;background:transparent;color:var(--dim);font-family:var(--mono);font-size:11px;
  padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .15s;letter-spacing:.03em;white-space:nowrap;
}
.breadcrumb:hover:not(:disabled){color:var(--ink);}
.breadcrumb.active{color:var(--amber);border:1px solid rgba(232,180,90,.25);}
.breadcrumb:disabled{color:var(--faint);cursor:default;}
nav .sp{flex:1;}
.level-tag{font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid rgba(232,180,90,.3);padding:3px 9px;border-radius:999px;white-space:nowrap;}

main{position:fixed;top:44px;left:0;right:0;bottom:0;overflow:auto;padding:16px;}
.view{display:none;}
.view.active{display:block;animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view svg{display:block;margin:0 auto;max-width:100%;height:auto;}
#v-l1 svg{width:min(930px,100%);}
#v-l2 svg{width:min(1500px,100%);}

.clickable{cursor:pointer;}
.clickable:hover{filter:brightness(1.3) drop-shadow(0 0 8px rgba(232,180,90,.15));}

/* component icon strip (SVG group shown under a container) */
.comp-strip rect.unit{
  fill:rgba(23,30,34,.95);stroke:var(--line2);cursor:pointer;
}
.comp-strip rect.unit:hover{stroke:#e8b45a;fill:rgba(232,180,90,.08);}
.comp-strip .uname{font-size:8.5px;fill:var(--dim);text-anchor:middle;}
.comp-strip .uname:hover{fill:var(--ink);}

.hint{
  position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:5;
  font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.04em;pointer-events:none;
  white-space:nowrap;
}

/* ── spec view ── */
.spec-wrap{max-width:1060px;margin:0 auto;padding:8px 0 30px;}
.spec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:12px;}
.spec-head h1{font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:.03em;}
.spec-head h1 span{color:var(--amber);}
.spec-head .m{font-family:var(--mono);font-size:11px;color:var(--dim);}
.spec-sec{margin:26px 0 12px;}
.spec-sec .sec-title{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.1em;margin-bottom:10px;}
.spec-sec .sec-title::after{content:"";display:block;width:100%;height:1px;background:var(--line);margin-top:6px;}
.spec-layer{
  border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--surface);
}
.spec-layer .lh{
  display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;user-select:none;
}
.spec-layer .lh:hover{background:rgba(255,255,255,.02);}
.spec-layer .lh .ln{font-family:var(--mono);font-size:17px;font-weight:700;width:34px;text-align:center;}
.spec-layer .lh .lt{font-size:14.5px;font-weight:600;}
.spec-layer .lh .ld{font-size:11px;color:var(--dim);margin-left:6px;flex:1;}
.spec-layer .lh .chev{color:var(--faint);transition:transform .2s;}
.spec-layer.open .lh .chev{transform:rotate(90deg);}
.spec-layer .lbody{display:none;padding:4px 18px 18px;border-top:1px solid var(--line);}
.spec-layer.open .lbody{display:block;}
.spec-field{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:7px 0;font-size:12px;line-height:1.65;}
.spec-field .k{font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:.08em;padding-top:2px;}
.spec-field .v{color:var(--dim);}
.spec-field .v b{color:var(--ink);font-weight:600;}
.spec-comps{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;}
.spec-comps .comps-label{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.08em;margin-bottom:6px;}
.spec-comp{padding:6px 0;}
.spec-comp .cn{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;}
.spec-comp .cn::before{content:"";width:5px;height:5px;border-radius:50%;flex:none;}
.spec-comp .cd{font-size:11.5px;color:var(--dim);margin:3px 0 0 12px;line-height:1.6;}
.spec-comp .cd .ct{font-family:var(--mono);font-size:10px;color:var(--faint);}

/* component detail tip */
.comp-tip{
  position:fixed;z-index:60;background:rgba(23,30,34,.98);border:1px solid var(--line2);
  border-radius:10px;box-shadow:0 18px 50px -18px rgba(0,0,0,.8);padding:12px 14px;
  animation:cardIn .18s ease;max-width:340px;
}
.comp-tip .ct-h{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.comp-tip .ct-x{margin-left:auto;cursor:pointer;color:var(--faint);font-size:14px;line-height:1;padding:2px 4px;border-radius:4px;}
.comp-tip .ct-x:hover{color:var(--ink);background:rgba(255,255,255,.06);}
.comp-tip .ct-row{font-size:11.5px;line-height:1.55;color:var(--dim);margin:4px 0;}
.comp-tip .ct-row .k{font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:.08em;display:block;margin-bottom:1px;}

</style>
</head>
<body>

<nav>
  <span class="logo">心理健康助手 · <span>C4 架构</span></span>
  <button class="breadcrumb active" id="bc-l1" data-level="l1">系统上下文</button>

const NS = 'http://www.w3.org/2000/svg';
let activeStrip = null;
let activeCompTip = null;

function setLevel(lv){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const target = document.getElementById('v-'+lv);
  if (target) target.classList.add('active');
  clearStrip(); closeCompTip();
  ['bc-l1','bc-l2','bc-spec'].forEach(id => {
    const b = document.getElementById(id);
    b.classList.toggle('active', b.dataset.level === lv);
    b.disabled = b.dataset.level === lv;
  });
  const labels = {l1:'L1 · 系统上下文',l2:'L2 · 容器图',spec:'规格文档'};
  document.getElementById('levelTag').textContent = labels[lv] || '';
}
document.getElementById('sysbox').addEventListener('click', () => setLevel('l2'));
document.getElementById('bc-l1').addEventListener('click', () => setLevel('l1'));
document.getElementById('bc-l2').addEventListener('click', () => setLevel('l2'));
document.getElementById('bc-spec').addEventListener('click', () => setLevel('spec'));

function clearStrip(){ if(activeStrip){ activeStrip.remove(); activeStrip=null; } }

function toggleStrip(layerId, containerG){
  if (activeStrip && activeStrip.dataset.layer === layerId){ clearStrip(); return; }
  clearStrip();
  const data = COMP_DATA[layerId];
  if (!data) return;
  const svg = document.getElementById('l2svg');
  const rect = containerG.querySelector('rect');
  const rb = rect.getBBox();
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'comp-strip');
  g.dataset.layer = layerId;

  const uw = 74, uh = 54, gap = 6, pad = 8;
  const stripW = data.length * (uw + gap) - gap + pad * 2;
  const x0 = rb.x + rb.width / 2 - stripW / 2;
  const y0 = rb.y + rb.height + 8;

  // backdrop
  const bg = document.createElementNS(NS, 'rect');
  bg.setAttribute('x', x0 - 6); bg.setAttribute('y', y0 - 6);
  bg.setAttribute('width', stripW + 12); bg.setAttribute('height', uh + 14);
  bg.setAttribute('rx', '9'); bg.setAttribute('fill', 'rgba(15,20,23,.96)');
  bg.setAttribute('stroke', 'rgba(232,180,90,.3)');
  g.appendChild(bg);

  data.forEach((c, i) => {
    const ux = x0 + pad + i * (uw + gap);
    const uy = y0;
    const unit = document.createElementNS(NS, 'rect');
    unit.setAttribute('class', 'unit');
    unit.setAttribute('x', ux); unit.setAttribute('y', uy);
    unit.setAttribute('width', uw); unit.setAttribute('height', uh);
    unit.setAttribute('rx', '7');
    const tip = document.createElementNS(NS, 'title');
    tip.textContent = c.d + '\n' + (c.ct || '') + '\n' + (c.cs || '');
    unit.appendChild(tip);
    g.appendChild(unit);
    // icon
    const ic = document.createElementNS(NS, 'use');
    ic.setAttribute('href', '#' + c.ic);
    ic.setAttribute('x', ux + uw/2 - 9); ic.setAttribute('y', uy + 6);
    ic.setAttribute('width', 18); ic.setAttribute('height', 18);
    ic.setAttribute('fill', 'none'); ic.setAttribute('stroke', c.c); ic.setAttribute('stroke-width', '2');
    ic.setAttribute('pointer-events', 'none');
    g.appendChild(ic);
    // name
    const nm = document.createElementNS(NS, 'text');
    nm.setAttribute('class', 'uname');
    nm.setAttribute('x', ux + uw/2); nm.setAttribute('y', uy + uh - 8);
    nm.setAttribute('pointer-events', 'none');
    nm.textContent = c.h;
    g.appendChild(nm);
    // click unit → show detail tip
    unit.addEventListener('click', (e) => {
      e.stopPropagation();
      showCompTip(c, e.clientX, e.clientY);
    });
  });

  svg.appendChild(g);
  activeStrip = g;
}

// container click → toggle icon strip
for (let i = 1; i <= 7; i++){
  const el = document.getElementById('c-l'+i);
  if (el) el.addEventListener('click', (e) => { e.stopPropagation(); toggleStrip('l'+i, el); });
}

document.addEventListener('click', (e) => {
  if (activeStrip && !e.target.closest('.clickable') && !e.target.closest('.unit')) clearStrip();
  if (activeCompTip && !e.target.closest('.comp-tip')) closeCompTip();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { clearStrip(); closeCompTip(); }
  if (e.key === 'ArrowRight' ) setLevel('l2');
  if (e.key === 'ArrowLeft') setLevel('l1');
});

/* ================================================================
   组件详情气泡 (click component unit)
   ================================================================ */
function closeCompTip(){ if(activeCompTip){ activeCompTip.remove(); activeCompTip=null; } }
function showCompTip(c, x, y){
  closeCompTip();
  const tip = document.createElement('div');
  tip.className = 'comp-tip';
  tip.innerHTML = `
    <div class="ct-h"><span style="width:8px;height:8px;border-radius:50%;background:${c.c};display:inline-block;"></span>${c.h}
      <span class="ct-x" title="关闭">✕</span></div>
    <div class="ct-row"><span class="k">职责</span>${c.d}</div>
    ${c.ct ? `<div class="ct-row"><span class="k">契约</span>${c.ct}</div>` : ''}
    ${c.cs ? `<div class="ct-row"><span class="k">约束</span>${c.cs}</div>` : ''}`;
  tip.querySelector('.ct-x').addEventListener('click', closeCompTip);
  document.body.appendChild(tip);
  // position near click, clamp
  const w = Math.min(340, window.innerWidth - 24);
  let left = x + 14;
  if (left + w > window.innerWidth - 10) left = Math.max(10, x - w - 14);
  tip.style.left = left + 'px';
  tip.style.top = Math.min(y + 14, window.innerHeight - tip.offsetHeight - 10) + 'px';
  tip.style.width = w + 'px';
  activeCompTip = tip;
}

/* ================================================================
   规格视图 (spec)
   ================================================================ */
function renderSpec(){
  const box = document.getElementById('specContent');
  const order = ['l1','l2','l3','l4','l5','l6','l7'];
  box.innerHTML = `
    <div class="spec-head">
      <h1>心理健康助手 · <span>架构规格文档</span></h1>
      <span class="m">C4 Container/Component 规格 · Arc42 风格 · 与架构图同源</span>
    </div>` +
  order.map(k => {
    const L = SPEC[k];
    const rows = [
      ['职责', L.desc],
      ['技术栈', L.tech],
      ['关键机制', L.mech],
      ['数据契约', L.contract],
      ['上下游', L.io],
      ['二期', L.phase2]
    ].map(([k2,v]) => `<div class="spec-field"><div class="k">${k2}</div><div class="v">${v}</div></div>`).join('');
    const comps = L.comps.map(c => `
      <div class="spec-comp">
        <div class="cn" style="--c:${c.c}"><span style="width:5px;height:5px;border-radius:50%;background:${c.c};flex:none;"></span>${c.h}</div>
        <div class="cd">${c.d}<br><span class="ct">契约 ${c.ct || '—'}</span> · <span class="ct">约束 ${c.cs || '—'}</span></div>
      </div>`).join('');
    return `
      <div class="spec-layer" id="spec-${k}">
        <div class="lh" data-target="spec-${k}">
          <div class="ln" style="color:${L.color}">${k.toUpperCase()}</div>
          <div class="lt">${L.name}</div>
          <div class="ld">${L.desc}</div>
          <div class="chev">▶</div>
        </div>
        <div class="lbody">
          ${rows}
          <div class="spec-comps"><div class="comps-label">内部组件 (${L.comps.length})</div>${comps}</div>
        </div>
      </div>`;
  }).join('');
  // toggle expand
  box.querySelectorAll('.lh').forEach(h => {
    h.addEventListener('click', () => {
      const layer = document.getElementById(h.dataset.target);
      layer.classList.toggle('open');
    });
  });
}

/* 开源参考章节渲染（与 architecture-spec.md §7 同源） */
function renderRef(){
  const box = document.getElementById('specContent');
  const t1 = REF.tier1.map(r => `
    <div class="spec-comp">
      <div class="cn"><span style="width:5px;height:5px;border-radius:50%;background:var(--amber);flex:none;"></span>${r.n} <span class="ct" style="font-size:10px;color:var(--faint)">${r.u}</span></div>
      <div class="cd"><span class="ct">star ${r.star} · 满足 ${r.hit} · ${r.use}</span><br>${r.note}</div>
    </div>`).join('');
  const t2 = REF.tier2.map(x => `<div class="spec-comp"><div class="cd" style="margin-left:0">· ${x}</div></div>`).join('');
  const drop = REF.drop.map(x => `<div class="spec-comp"><div class="cd" style="margin-left:0">✗ ${x}</div></div>`).join('');

  box.insertAdjacentHTML('beforeend', `
    <div class="spec-layer" id="spec-ref">
      <div class="lh" data-target="spec-ref">
        <div class="ln" style="color:var(--amber)">REF</div>
        <div class="lt">开源参考（四条件筛选）</div>
        <div class="ld">知名度/活跃/架构/star · ≥3条第一梯队可答辩背书 · 数据 2026-08-09 实测</div>
        <div class="chev">▶</div>
      </div>
      <div class="lbody">
        <div class="comps-label" style="margin-bottom:6px;">第一梯队（达标可答辩背书）</div>
        ${t1}
        <div class="spec-comps"><div class="comps-label">第二梯队（2/4 压线，设计思路参考）</div>${t2}</div>
        <div class="spec-comps"><div class="comps-label">淘汰 / 谨慎</div>${drop}</div>
      </div>
    </div>`);

  const layer = document.getElementById('spec-ref');
  layer.querySelector('.lh').addEventListener('click', () => layer.classList.toggle('open'));
}

// init spec view lazily
document.getElementById('bc-spec').addEventListener('click', () => {
  if (!document.getElementById('specContent').children.length){ renderSpec(); renderRef(); }
});
