[project]
name = "gpt-sovits-tts"
version = "2.0.0"
description = "GPT-SoVITS v2 推理栈 + tts_service(127.0.0.1:9001 远程 TTS 服务)"
# 3.12:torch 2.6 / transformers 4.50 这套推理栈的标定区间。
# 解释器由 .python-version 定(3.12.15)。
requires-python = ">=3.12,<3.13"

# 版本全部 == 钉死:本文件从跑通的 conda gpt-sovite-v2 环境 pip freeze 反推,
# 已按 RTX 4060 + tts_infer.yaml 的推理参数标定。改版本号 = 主动变更。
dependencies = [
    # ── torch(CUDA 版,走 pytorch 索引;Windows 上 PyPI 只有 CPU 版) ──
    "torch==2.6.0+cu124",
    "torchaudio==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
    "numpy==1.26.4",

    # matplotlib 不是训练专用:AR/modules/lr_schedulers.py:6 顶层 import 它,
    # 而 AR/models/t2s_lightning_module.py:14 会拉 lr_schedulers —— 推理链上跑不掉。
    # 版本取自 conda 基线(gpt-sovite-v2 的 matplotlib==3.11.2);
    # 3.11.2 要求 numpy>=1.25,本环境 numpy 1.26.4 满足,不与 torch 2.6 冲突。
    "matplotlib==3.11.2",

    # ── 语义 token 侧(AR 模型走 pytorch-lightning / torchmetrics) ──
    "transformers==4.50.0",
    "tokenizers==0.21.4",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "pytorch-lightning==2.6.6",
    "torchmetrics==1.5.0",
    "safetensors==0.8.0",
    "huggingface-hub==0.36.2",

    # ── 声学侧 ──
    "librosa==0.10.2",
    "soundfile==0.14.0",
    "scipy==1.17.1",
    "ffmpeg-python==0.2.0",
    "av==19.0.1",
    "rotary-embedding-torch==0.9.1",

    # ── 中文 G2P(v2 + zh 强制走 text.chinese2 → text.g2pw) ──
    # onnx_api.py 顶层 import:onnxruntime / opencc / requests / transformers
    "onnxruntime-gpu==1.20.2",
    "opencc==1.4.2",
    "pypinyin==0.55.0",
    "jieba-fast==0.53",
    "cn2an==0.5.24",
    # LangSegmenter → split_lang.LangSplitter → fast_langdetect
    "split-lang==2.1.1",
    "fast-langdetect==1.0.1",
    "robust-downloader==0.0.2",

    # ── openai-whisper:不是 tts_service 用的,是 feature_extractor/__init__.py
    #    的 `from . import cnhubert, whisper_enc` 把 whisper 拉进 import 链,
    #    跑不掉。BigVGAN 的 alias_free_activation 同理(仓库自带,不需装)。
    "openai-whisper==20250625",

    # ── 推理链的间接但必需项(从跑通环境反查,漏一个就是 import 时炸) ──
    # f5_tts / x_transformers 侧:torch-einops-utils → einx → frozendict
    "torch-einops-utils==0.1.36",
    "einx==0.4.3",
    "frozendict==2.4.7",
    # f5_tts/model/backbones/dit.py:16 顶层 import;RotaryEmbedding 来自这里
    "x-transformers==2.31.7",
    "torch-complex==0.4.4",
    # fast_langdetect 的 native 后端
    "fasttext-predict==0.9.2.4",
    # tools/i18n 与 misc
    "chardet==7.6.0",
    "defusedxml==0.7.1",
    "coloredlogs==15.0.1",
    "jieba==0.42.1",
    "wordsegment==1.3.1",
    "pillow==10.4.0",
    "pandas==2.3.3",
    "pytz==2026.5",
    "orjson==3.12.0",
    "rich==15.0.0",

    # ── 其他 ──
    "einops==0.8.2",
    "sentencepiece==0.2.2",
    "requests==2.34.2",
    "tqdm==4.70.1",
    "packaging==26.3",

    # ── tts_service 自身 ──
    "fastapi==0.142.2",
    "uvicorn==0.50.1",
    "pydantic==2.10.6",
    "prometheus-client==0.26.0",
    "pyyaml==6.0.3",
    "loguru==0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# tts_service 是包(GPT-SoVITS/__main__.py 以 `python -m tts_service` 启动);
# GPT_SoVITS/ 与 tools/ 是以 sys.path 方式导入的源码树,不进 wheel。
packages = ["tts_service"]

# ── PyTorch CUDA 索引 ──
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
