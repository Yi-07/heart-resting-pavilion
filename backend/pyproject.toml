[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "funasr[knf]>=1.4.8",
    "jieba>=0.42.1",
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "onnxruntime<1.24",
    "openai>=3.6.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
overrides = [
  { module = ["jieba", "rank_bm25"], ignore_missing_imports = true },
  # funasr 无 py.typed;torchaudio/cosyvoice 只在 CosyVoice sidecar venv 存在
  { module = ["funasr", "funasr.*"], ignore_missing_imports = true },
  { module = ["torchaudio", "torchaudio.*", "cosyvoice.*"], ignore_missing_imports = true },
]
