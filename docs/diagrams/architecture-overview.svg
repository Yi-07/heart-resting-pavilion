<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hrp-arch-title hrp-arch-desc">
      <title id="hrp-arch-title">心栖阁架构总览</title>
      <desc id="hrp-arch-desc">架构图：用户经 Vue3 前端以 WebSocket 与 REST 两种通道接入 FastAPI 后端；每条输入先过危机闸门，命中走危机序列，未命中按规则分流 answer 直答或 collect 多轮采集；RAG 引擎、记忆层、TTS sidecar 为后端支撑组件。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- 车道布局：
           上排 y=152-272：网关(452-652) · 记忆层(740-916)；TTS(256-380 y=80-136) 在 zone 外左上
           中排 y=336-440：闸门菱形(440-616 中轴 528) · crisis(700-868 y=360-416)
           下一排 y=504-560：answer(440-560 中轴 500) · collect(700-868 正对 crisis)
           下二排 y=600-656：RAG(456-544 中轴 500) · Chroma(600-768) · REST(812-988)
           左翼：前端(144-272 y=152-336) · 用户(112-208 y=376-432)，上下留 40px 缝
           走廊：A2 走底缘 y=676；A7 走 x=940 右走廊上行、y=248 入网关右缘；A8 x=800 直上 crisis 底缘 -->

      <!-- ============ Zone: 后端 ============ -->
      <rect x="420" y="96" width="584" height="596" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="652" y="100" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="712" y="109" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="Consolas, monospace"
            text-anchor="middle" letter-spacing="0.14em">BACKEND · FASTAPI</text>

      <!-- ============ Arrows ============ -->
      <!-- A0: 用户 <-> 前端（双竖直：用户顶 y=376 ↔ 前端底 y=336，缝 40px，挂点 x=160/184） -->
      <path d="M 160,376 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 184,336 V 376" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- A1: 前端 -> 网关（accent 主流） -->
      <line x1="272" y1="192" x2="452" y2="192" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- A1r: 网关 -> 前端（回程虚线） -->
      <line x1="452" y1="216" x2="272" y2="216" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- A2: 前端 -> REST（前端底出 x=240 → 底缘走廊 y=676 → REST 底入 x=900） -->
      <path d="M 240,336 V 668 Q 240,676 248,676 H 892 Q 900,676 900,668 V 656" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- A3: 网关底 -> 闸门顶（同轴直线） -->
      <line x1="528" y1="272" x2="528" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A4: 闸门右 -> crisis 左（accent 同行） -->
      <line x1="616" y1="388" x2="700" y2="388" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- A5: 闸门底 -> 分流 y=468 -> answer 顶(x=500) / collect 顶(x=760) -->
      <line x1="528" y1="440" x2="528" y2="468" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 528,468 H 508 Q 500,468 500,476 V 504" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 528,468 H 752 Q 760,468 760,476 V 504" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A6: answer 底 -> RAG 顶（同轴 x=500） -->
      <line x1="500" y1="552" x2="500" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A7: collect 右 -> 网关右（draw 回程：右走廊 x=940 上行，y=248 入网关右缘） -->
      <path d="M 868,532 H 932 Q 940,532 940,524 V 256 Q 940,248 932,248 H 652" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- A8: collect 顶 -> crisis 底（软信号升级：同轴 x=800 直上） -->
      <line x1="800" y1="504" x2="800" y2="416" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- A9: RAG 右 <-> Chroma 左（同行水平双线） -->
      <line x1="544" y1="614" x2="600" y2="614" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="634" x2="544" y2="634" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- A10: 网关右 <-> 记忆层左（同行水平双线） -->
      <line x1="652" y1="176" x2="740" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="740" y1="204" x2="652" y2="204" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- A11: TTS 右 <-> 网关顶（虚线双向：外轨 y=100 去程入 x=500，内轨 y=124 回程出 x=476） -->
      <path d="M 380,100 H 492 Q 500,100 500,108 V 152" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 476,152 V 132 Q 476,124 468,124 H 380" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

