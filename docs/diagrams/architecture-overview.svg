      <rect x="508" y="568" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="540" y="580" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">门控调用</text>

      <rect x="760" y="226" width="100" height="16" rx="2" fill="#f5f5f5"/>
      <text x="810" y="238" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">draw 全量+seq</text>

