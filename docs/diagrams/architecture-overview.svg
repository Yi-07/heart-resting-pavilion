      <rect x="536" y="296" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="568" y="308" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">每条输入</text>

      <rect x="634" y="366" width="48" height="16" rx="2" fill="#f5f5f5"/>
