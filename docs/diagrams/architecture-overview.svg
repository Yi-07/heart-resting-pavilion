      <rect x="314" y="170" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="362" y="182" fill="#eb6c36" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">WS 9 种消息</text>
      <rect x="318" y="222" width="88" height="16" rx="2" fill="#f5f5f5"/>
