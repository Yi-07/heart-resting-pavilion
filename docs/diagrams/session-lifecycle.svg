<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hrp-seq-title hrp-seq-desc">
      <title id="hrp-seq-title">心栖阁会话生命周期</title>
      <desc id="hrp-seq-desc">时序图：用户经前端建立 WebSocket 会话并选心情输入文本；每条输入过危机闸门后分三路——命中走危机序列并落审计，answer 流式直答并记轮次，collect 多轮采集产出 formulation 与小结卡；断开重连后网关从记忆层读快照推回放帧。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Lifelines（behind all） ============ -->
      <!-- actor centers: 140, 400, 660, 900 (4 lifelines; 用户并入前端消息来源) -->
      <line x1="140" y1="120" x2="140" y2="752" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="400" y1="120" x2="400" y2="752" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="660" y1="120" x2="660" y2="752" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="900" y1="120" x2="900" y2="752" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ============ Activation bars ============ -->
      <!-- 前端：M1 发起连接 (y=152) 到 replay 帧收到 (y=728) -->
      <rect x="396" y="152" width="8" height="588" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- 网关：M1 收连接 (y=152) 到 replay 帧发出 (y=728) -->
      <rect x="656" y="152" width="8" height="588" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ============ Combined fragment: ALT 三分支 (y=256-600) ============ -->
      <rect x="96" y="256" width="852" height="344" rx="4"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
      <rect x="96" y="256" width="40" height="16" rx="2"
            fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
      <text x="116" y="268" fill="#4f5d75" font-size="8"
            font-family="Consolas, monospace" text-anchor="middle"
            letter-spacing="0.12em">ALT</text>
      <text x="144" y="268" fill="#4f5d75" font-size="8"
            font-family="Consolas, monospace" letter-spacing="0.04em">[危机闸门命中]</text>
      <!-- divider 1 -->
      <line x1="104" y1="344" x2="940" y2="344" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="144" y="360" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" letter-spacing="0.04em">[else answer]</text>
      <!-- divider 2 -->
      <line x1="104" y1="432" x2="940" y2="432" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="144" y="448" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" letter-spacing="0.04em">[else collect]</text>

      <!-- ============ Messages（time flows down） ============ -->
      <!-- M1: FE -> GW 连接（solid muted） -->
      <line x1="404" y1="152" x2="656" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M2: 用户动作（前端自环表达用户输入） -->
      <path d="M 404 196 L 444 196 L 444 218 L 404 218" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="452" y="192" width="120" height="16" rx="2" fill="#f5f5f5"/>
      <text x="512" y="204" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">选心情 · 输入文本</text>
      <!-- M3: FE -> GW mood/user_input -->
      <line x1="404" y1="240" x2="656" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 命中分支 -->
      <line x1="656" y1="296" x2="404" y2="296" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 664 320 H 900" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- answer 分支 -->
      <line x1="656" y1="384" x2="404" y2="384" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 664 408 H 900" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- collect 分支：loop 内 GW<->LG 交互（LOOP x=560-924 y=460-548，包住 GW↔BE 两条消息） -->
      <rect x="560" y="460" width="364" height="88" rx="4"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
      <rect x="560" y="460" width="44" height="16" rx="2"
            fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
      <text x="582" y="472" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="612" y="472" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" letter-spacing="0.04em">[采集轮]</text>
      <line x1="664" y1="500" x2="900" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="900" y1="532" x2="664" y2="532" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- collect 出口：formulation + 小结卡（ALT [else collect] 内，LOOP 之后） -->
      <line x1="656" y1="580" x2="404" y2="580" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- 重连段（ALT 之后 y=620-728） -->
      <path d="M 404 620 L 440 620 L 440 640 L 404 640" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <line x1="404" y1="672" x2="656" y2="672" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 664 700 H 900" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="656" y1="728" x2="404" y2="728" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ============ Message labels（mask 底 = 线 y − 6） ============ -->
      <rect x="472" y="130" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="528" y="142" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">WS 连接建 session</text>


      <rect x="452" y="216" width="128" height="16" rx="2" fill="#f5f5f5"/>
      <text x="516" y="228" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">mood_select / user_input</text>

      <rect x="474" y="274" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="530" y="286" fill="#eb6c36" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">crisis 序列</text>

      <rect x="708" y="298" width="60" height="16" rx="2" fill="#f5f5f5"/>
      <text x="738" y="310" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">落审计</text>

      <rect x="470" y="362" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="526" y="374" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">LLM 流式直答</text>

      <rect x="708" y="386" width="60" height="16" rx="2" fill="#f5f5f5"/>
      <text x="738" y="398" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">记轮次</text>

      <rect x="700" y="478" width="60" height="16" rx="2" fill="#f5f5f5"/>
      <text x="730" y="490" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">启动轮次</text>

      <rect x="700" y="510" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="756" y="522" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">draw 全量 + seq</text>

      <rect x="452" y="558" width="128" height="16" rx="2" fill="#f5f5f5"/>
      <text x="516" y="570" fill="#eb6c36" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">formulation · 小结卡</text>

      <rect x="448" y="622" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="504" y="634" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">断开后重连</text>

      <rect x="466" y="650" width="120" height="16" rx="2" fill="#f5f5f5"/>
      <text x="526" y="662" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">认领 session_id</text>

      <rect x="700" y="678" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="756" y="690" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">读热/温层快照</text>

      <rect x="470" y="706" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="510" y="718" fill="#eb6c36" font-size="12" font-weight="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">replay 帧</text>

      <!-- ============ Actor boxes ============ -->
      <!-- 用户（external） -->
      <rect x="72" y="72" width="136" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="72" width="136" height="48" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="80" y="80" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="96" y="89" fill="#7a8399" font-size="7" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="140" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">用户</text>

      <!-- 前端（component） -->
      <rect x="332" y="72" width="136" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="332" y="72" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="340" y="80" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="352" y="89" fill="#2d3142" font-size="7" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FE</text>
      <text x="400" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">前端</text>

      <!-- WS 网关（focal） -->
      <rect x="592" y="72" width="136" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="72" width="136" height="48" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="600" y="80" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="616" y="89" fill="#eb6c36" font-size="7" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
      <text x="660" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">WS 网关</text>

      <!-- collect 图/记忆层（component, 合并标注为后端内部） -->
      <rect x="832" y="72" width="136" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="832" y="72" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="840" y="80" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="862" y="89" fill="#2d3142" font-size="7" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">BE</text>
      <text x="900" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">collect 图 · 记忆层</text>

      <!-- ============ Legend ============ -->
      <line x1="40" y1="752" x2="1040" y2="752" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="768" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="104" y="760" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="124" y="768" fill="#4f5d75" font-size="8.5" font-family="'Microsoft YaHei','PingFang SC',sans-serif">焦点（网关）</text>

      <line x1="240" y1="766" x2="268" y2="766" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="276" y="768" fill="#4f5d75" font-size="8.5" font-family="'Microsoft YaHei','PingFang SC',sans-serif">调用消息</text>

      <line x1="360" y1="766" x2="388" y2="766" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="396" y="768" fill="#4f5d75" font-size="8.5" font-family="'Microsoft YaHei','PingFang SC',sans-serif">返回 / 异步</text>

      <line x1="490" y1="766" x2="518" y2="766" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="526" y="768" fill="#4f5d75" font-size="8.5" font-family="'Microsoft YaHei','PingFang SC',sans-serif">关键输出</text>
    </svg>